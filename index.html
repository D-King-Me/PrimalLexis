<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>啊呜 · 动态版</title>
<style>
:root{
  --c-skin:#f8fbff;
  --c-hair:#b8e0f5;
  --c-hair-dark:#84b8d8;
  --c-eye:#4888bb;
  --c-line:#5588aa;
  --c-bg:#f4f9fc;
  --c-text:#224466;
}
*{box-sizing:border-box;margin:0;padding:0;}
body{
  width:100vw; height:100vh;
  background:var(--c-bg);
  display:flex; justify-content:center; align-items:center;
  font-family:system-ui, sans-serif;
  overflow:hidden;
  position:relative;
}

/* 主角容器 */
.stage{
  width: 420px;
  height: 520px;
  position: relative;
  cursor: pointer;
  transition: transform 0.3s;
}
.stage:hover{
  transform: scale(1.02);
}

/* 整体呼吸动画 */
.awu-body {
  width: 100%; height: 100%;
  animation: breathe 3s ease-in-out infinite;
  transform-origin: 50% 80%;
}
@keyframes breathe {
  0%, 100% { transform: translateY(0) scale(1); }
  50% { transform: translateY(-6px) scale(1.01); }
}

/* 眨眼 */
.eye-left, .eye-right {
  animation: blink 4s infinite;
  transform-origin: center;
}
@keyframes blink {
  0%, 92%, 100% { transform: scaleY(1); }
  96% { transform: scaleY(0.1); }
}

/* 发丝摇摆 */
.hair-left, .hair-right {
  transform-origin: top center;
  animation: sway 4s ease-in-out infinite alternate;
}
.hair-right { animation-delay: -2s; }
@keyframes sway {
  from { transform: rotate(-3deg); }
  to   { transform: rotate(3deg); }
}

/* 嘴巴小动效 */
.mouth {
  animation: talk 0.8s ease-in-out infinite alternate;
}
@keyframes talk {
  from { transform: translateY(0); }
  to   { transform: translateY(1.5px); }
}

/* 气泡样式 */
.bubble{
  position:absolute;
  top: 20%; left: 50%;
  transform: translateX(-50%) scale(0);
  background: rgba(255,255,255,0.92);
  border: 1.5px solid var(--c-hair-dark);
  border-radius: 16px;
  padding: 10px 20px;
  font-size: 15px; color: #1d4666;
  box-shadow: 0 4px 10px rgba(100,160,200,0.15);
  opacity: 0;
  transition: 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  pointer-events: none;
  white-space: nowrap;
}
.bubble.show{
  transform: translateX(-50%) scale(1);
  opacity: 1;
}
</style>
</head>
<body>

<div class="stage" id="awu" title="点我互动">
  <!-- 气泡 -->
  <div class="bubble" id="bubble">啊呜～</div>

  <!-- SVG 角色 -->
  <svg class="awu-body" viewBox="0 0 420 480">
    <!-- 头发（带摇摆） -->
    <g class="hair-left"><path d="M210 70 C130 80, 90 160, 100 270 C110 340, 160 380, 210 390 C260 380, 310 340, 320 270 C330 160, 290 80, 210 70 Z" fill="var(--c-hair)" stroke="var(--c-line)" stroke-width="2"/></g>
    <g class="hair-right"><path d="M110 130 C100 190, 115 260,135 310" fill="none" stroke="var(--c-hair-dark)" stroke-width="2"/></g>
    <path d="M310 130 C320 190,305 260,285 310" fill="none" stroke="var(--c-hair-dark)" stroke-width="2"/>

    <!-- 白色发带 -->
    <path d="M140 85 C180 65, 240 65, 280 85 C270 70, 210 50, 150 70 Z" fill="#ffffff" stroke="#b8d4e8" stroke-width="1.5"/>
    <!-- X发夹 -->
    <line x1="240" y1="140" x2="265" y2="165" stroke="#ffffff" stroke-width="4"/>
    <line x1="265" y1="140" x2="240" y2="165" stroke="#ffffff" stroke-width="4"/>

    <!-- 脸 -->
    <ellipse cx="210" cy="210" rx="82" ry="95" fill="var(--c-skin)" stroke="var(--c-line)" stroke-width="2"/>

    <!-- 眼睛（带眨眼） -->
    <g class="eye-left">
      <ellipse cx="162" cy="200" rx="14" ry="18" fill="var(--c-eye)"/>
      <circle cx="156" cy="194" r="4" fill="#fff"/>
    </g>
    <g class="eye-right">
      <ellipse cx="258" cy="200" rx="14" ry="18" fill="var(--c-eye)"/>
      <circle cx="252" cy="194" r="4" fill="#fff"/>
    </g>

    <!-- 嘴巴 -->
    <path class="mouth" d="M204 235 Q210 242 216 235" fill="none" stroke="#996677" stroke-width="2" stroke-linecap="round"/>

    <!-- 耳机 -->
    <circle cx="110" cy="230" r="24" fill="#dde8f0" stroke="#668899" stroke-width="2"/>
    <circle cx="310" cy="230" r="24" fill="#dde8f0" stroke="#668899" stroke-width="2"/>
    <path d="M110 230 C90 200, 100 160,140 140" fill="none" stroke="#668899" stroke-width="2"/>
    <path d="M310 230 C330 200, 320 160,280 140" fill="none" stroke="#668899" stroke-width="2"/>

    <!-- 手 -->
    <path d="M100 220 C90 260,110 290,130 280 C145 270,140 240,120 225 Z" fill="var(--c-skin)" stroke="var(--c-line)" stroke-width="1.5"/>
    <path d="M320 220 C330 260,310 290,290 280 C275 270,280 240,300 225 Z" fill="var(--c-skin)" stroke="var(--c-line)" stroke-width="1.5"/>

    <!-- 衣服 -->
    <path d="M140 290 C120 360, 130 440, 210 450 C290 440, 300 360, 280 290 C250 310, 170 310,140 290 Z" fill="#d8eaf7" stroke="var(--c-line)" stroke-width="2"/>
  </svg>
</div>

<script>
const awu = document.getElementById("awu");
const bubble = document.getElementById("bubble");
const msgList = [
  "啊呜～！",
  "反内卷啦～",
  "恒道AI在线",
  "DNAI 01101001",
  "你点我干嘛呀？",
  "要一起推演吗？",
  "根锚定好了哦。"
];

awu.onclick = () => {
  // 随机选一句话
  bubble.textContent = msgList[Math.floor(Math.random() * msgList.length)];
  // 显示气泡
  bubble.classList.add("show");
  // 1.5秒后隐藏
  clearTimeout(window.bubbleTimer);
  window.bubbleTimer = setTimeout(() => {
    bubble.classList.remove("show");
  }, 1500);
};
</script>
</body>
</html>
