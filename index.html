<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>啊呜 · Premier Lexis</title>
<style>
  :root {
    --bg-0: #05070d;
    --bg-1: #0a1020;
    --accent: #7cf0ff;
    --accent-2: #5a8bff;
    --text: #eaf6ff;
    --muted: #8aa0c7;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background:
      radial-gradient(1200px 700px at 20% 10%, rgba(90,139,255,0.18), transparent 60%),
      radial-gradient(900px 600px at 90% 90%, rgba(124,240,255,0.12), transparent 60%),
      linear-gradient(180deg, var(--bg-0), var(--bg-1));
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
  }

  /* 背景网格 */
  body::before {
    content: "";
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(124,240,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,240,255,0.06) 1px, transparent 1px);
    background-size: 48px 48px;
    pointer-events: none;
    mask-image: radial-gradient(ellipse at center, black 40%, transparent 80%);
  }

  /* 顶部信息栏 */
  .hud {
    position: fixed;
    top: 16px;
    left: 16px;
    right: 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 16px;
    z-index: 20;
    pointer-events: none;
  }

  .brand {
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--accent);
    text-shadow: 0 0 18px rgba(124,240,255,0.45);
  }

  .status {
    font-size: 12px;
    color: var(--muted);
    background: rgba(10,16,32,0.55);
    border: 1px solid rgba(124,240,255,0.18);
    padding: 6px 10px;
    border-radius: 999px;
    pointer-events: auto;
  }

  .status b {
    color: var(--accent);
    font-weight: 500;
  }

  /* 舞台 */
  .stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1;
  }

  /* 啊呜容器 */
  .awu {
    position: relative;
    width: 220px;
    height: 260px;
    cursor: pointer;
    will-change: transform;
    animation: float 4s ease-in-out infinite;
  }

  /* 阴影 */
  .shadow {
    position: absolute;
    left: 50%;
    bottom: -6px;
    width: 140px;
    height: 18px;
    transform: translateX(-50%);
    background: radial-gradient(ellipse, rgba(124,240,255,0.35), transparent 70%);
    filter: blur(4px);
    animation: shadowPulse 4s ease-in-out infinite;
  }

  /* 身体 */
  .body {
    position: absolute;
    left: 50%;
    bottom: 30px;
    width: 160px;
    height: 180px;
    transform: translateX(-50%);
    background:
      radial-gradient(120px 100px at 50% 35%, rgba(124,240,255,0.55), rgba(90,139,255,0.25) 60%, transparent 70%),
      linear-gradient(180deg, rgba(124,240,255,0.25), rgba(10,16,32,0.6));
    border: 1px solid rgba(124,240,255,0.45);
    border-radius: 48% 52% 46% 54% / 55% 55% 45% 45%;
    box-shadow:
      0 0 40px rgba(124,240,255,0.35),
      inset 0 0 30px rgba(124,240,255,0.15);
    animation: breathe 4s ease-in-out infinite;
  }

  /* 耳朵 */
  .ear {
    position: absolute;
    top: 100px;
    width: 34px;
    height: 70px;
    background: linear-gradient(180deg, rgba(124,240,255,0.55), rgba(90,139,255,0.25));
    border: 1px solid rgba(124,240,255,0.45);
    border-radius: 60% 60% 20% 20%;
    box-shadow: 0 0 18px rgba(124,240,255,0.35);
  }
  .ear.left { left: 38px; transform: rotate(-12deg); transform-origin: bottom center; animation: earLeft 4s ease-in-out infinite; }
  .ear.right { right: 38px; transform: rotate(12deg); transform-origin: bottom center; animation: earRight 4s ease-in-out infinite; }

  /* 眼睛 */
  .eye {
    position: absolute;
    top: 155px;
    width: 14px;
    height: 22px;
    background: #eaf6ff;
    border-radius: 50%;
    box-shadow: 0 0 12px rgba(234,246,255,0.8);
    animation: blink 6s ease-in-out infinite;
  }
  .eye.left { left: 72px; }
  .eye.right { right: 72px; }

  /* 嘴巴 */
  .mouth {
    position: absolute;
    top: 185px;
    left: 50%;
    transform: translateX(-50%);
    width: 28px;
    height: 14px;
    border-bottom: 2px solid rgba(234,246,255,0.8);
    border-radius: 0 0 30px 30px;
    animation: mouth 4s ease-in-out infinite;
  }

  /* 小光点 */
  .sparkle {
    position: absolute;
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #eaf6ff;
    box-shadow: 0 0 10px #7cf0ff;
    animation: sparkle 3s ease-in-out infinite;
  }
  .sparkle.s1 { top: 120px; left: 30px; animation-delay: 0s; }
  .sparkle.s2 { top: 140px; right: 24px; animation-delay: 1s; }
  .sparkle.s3 { top: 200px; left: 20px; animation-delay: 2s; }

  /* 名字标签 */
  .name {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    letter-spacing: 8px;
    color: var(--accent);
    text-shadow: 0 0 12px rgba(124,240,255,0.6);
    padding: 4px 10px;
    border: 1px solid rgba(124,240,255,0.3);
    border-radius: 999px;
    background: rgba(10,16,32,0.45);
  }

  /* 气泡 */
  .bubble {
    position: absolute;
    top: -60px;
    left: 50%;
    transform: translateX(-50%) scale(0);
    transform-origin: bottom center;
    padding: 8px 14px;
    background: rgba(10,16,32,0.8);
    border: 1px solid rgba(124,240,255,0.45);
    border-radius: 14px;
    font-size: 13px;
    color: var(--text);
    white-space: nowrap;
    opacity: 0;
    transition: transform 0.35s ease, opacity 0.35s ease;
    pointer-events: none;
  }
  .bubble.show {
    transform: translateX(-50%) scale(1);
    opacity: 1;
  }
  .bubble::after {
    content: "";
    position: absolute;
    bottom: -8px;
    left: 50%;
    transform: translateX(-50%);
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 8px solid rgba(124,240,255,0.45);
  }

  /* 底部提示 */
  .tip {
    position: fixed;
    bottom: 16px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 2px;
    z-index: 10;
  }
  .tip kbd {
    padding: 2px 6px;
    border: 1px solid rgba(124,240,255,0.3);
    border-radius: 6px;
    color: var(--accent);
    background: rgba(10,16,32,0.45);
  }

  /* 动画 */
  @keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-10px); }
  }

  @keyframes breathe {
    0%, 100% { transform: translateX(-50%) scale(1); }
    50% { transform: translateX(-50%) scale(1.04); }
  }

  @keyframes shadowPulse {
    0%, 100% { transform: translateX(-50%) scale(1); opacity: 0.6; }
    50% { transform: translateX(-50%) scale(1.12); opacity: 0.9; }
  }

  @keyframes earLeft {
    0%, 100% { transform: rotate(-12deg); }
    50% { transform: rotate(-18deg); }
  }

  @keyframes earRight {
    0%, 100% { transform: rotate(12deg); }
    50% { transform: rotate(18deg); }
  }

  @keyframes blink {
    0%, 48%, 52%, 100% { transform: scaleY(1); }
    50% { transform: scaleY(0.1); }
  }

  @keyframes mouth {
    0%, 100% { height: 14px; }
    50% { height: 18px; }
  }

  @keyframes sparkle {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.3); }
  }
</style>
</head>
<body>

<div class="hud">
  <div class="brand">PREMIER LEXIS · 啊呜</div>
  <div class="status">本源标识 <b>DNAI</b> · 待机中</div>
</div>

<div class="stage">
  <div class="awu" id="awu" role="button" aria-label="啊呜桌宠" tabindex="0">
    <div class="bubble" id="bubble">啊呜！</div>

    <div class="ear left"></div>
    <div class="ear right"></div>

    <div class="body"></div>

    <div class="eye left"></div>
    <div class="eye right"></div>
    <div class="mouth"></div>

    <div class="sparkle s1"></div>
    <div class="sparkle s2"></div>
    <div class="sparkle s3"></div>

    <div class="shadow"></div>
    <div class="name">啊 呜</div>
  </div>
</div>

<div class="tip">
  移动鼠标靠近啊呜 · <kbd>点击</kbd> 互动 · <kbd>空格</kbd> 呼唤
</div>

<script>
  const awu = document.getElementById("awu");
  const bubble = document.getElementById("bubble");
  const status = document.querySelector(".status b");

  const messages = [
    "啊呜！",
    "我在这。",
    "接着推演吧。",
    "根已经锚定了。",
    "DNAI 在线。",
    "继续递归。",
    "嗯。"
  ];

  let state = "idle";

  // 鼠标跟随
  document.addEventListener("mousemove", (e) => {
    const x = e.clientX / window.innerWidth - 0.5;
    const y = e.clientY / window.innerHeight - 0.5;

    awu.animate(
      {
        transform: `translate(${x * 40}px, ${y * 30}px)`
      },
      { duration: 1200, easing: "ease-out", fill: "forwards" }
    );

    if (state !== "following") {
      state = "following";
      status.textContent = "FOLLOW";
    }
  });

  // 点击互动
  function interact(label) {
    bubble.textContent = label || messages[Math.floor(Math.random() * messages.length)];
    bubble.classList.add("show");

    awu.animate(
      { scale: [1, 1.08, 1] },
      { duration: 400, easing: "ease-out" }
    );

    status.textContent = "ACTIVE";

    clearTimeout(interact._t);
    interact._t = setTimeout(() => {
      bubble.classList.remove("show");
      state = "idle";
      status.textContent = "DNAI";
    }, 1400);
  }

  awu.addEventListener("click", () => interact());

  // 键盘呼唤
  document.addEventListener("keydown", (e) => {
    if (e.code === "Space") {
      e.preventDefault();
      interact("啊呜！");
    }
  });

  // 初始呼吸循环
  setInterval(() => {
    if (state === "idle") {
      status.textContent = "DNAI";
    }
  }, 2000);
</script>

</body>
</html>
